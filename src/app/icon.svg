<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    The Union Flag at its real proportions, sat in the square like a server
    icon: two to one, inset from the edges, corners rounded.

    The previous version squashed the flag into the square and then narrowed
    every band until the *areas* came back out right. The areas did — and it
    still looked wrong, because a flag is recognised by its geometry and not by
    its colour ratios. A fat upright cross with short diagonals is not the
    Union Flag however much navy is left showing.

    So this is the standard construction instead, on the flag's own 60x30
    field: the red cross a fifth of the height with a fifteenth of white either
    side, the white saltire a fifth, the red saltire a fifteenth, and the
    counterchange done with the four-triangle clip that is the only tidy way to
    draw it. Nothing is tuned. It is the flag.

    Rounded and inset rather than bled to the edges because at the size this is
    actually seen — 16 to 32 pixels, against a browser chrome of unknown
    colour — a shape with its own edge reads as an object, and one that runs to
    the corners reads as a background.
  -->

  <!-- The tile. Everything below is clipped to it, corners included. -->
  <clipPath id="tile">
    <rect x="2" y="17" width="60" height="30" rx="7" />
  </clipPath>

  <g clip-path="url(#tile)">
    <g transform="translate(2 17)">
      <!--
        The counterchange: four triangles from the centre, so each half of the
        red saltire is clipped to the side of the white one it belongs on. Draw
        the red diagonals without this and the saltire is centred, which is the
        single most common way to get this flag wrong.
      -->
      <clipPath id="counterchange">
        <path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z" />
      </clipPath>

      <rect width="60" height="30" fill="#012169" />

      <!-- St Andrew, then St Patrick counterchanged inside it. -->
      <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6" />
      <path
        d="M0,0 L60,30 M60,0 L0,30"
        clip-path="url(#counterchange)"
        stroke="#C8102E"
        stroke-width="4"
      />

      <!-- St George: the white fimbriation, then the red cross over it. -->
      <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10" />
      <path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6" />
    </g>
  </g>
</svg>
